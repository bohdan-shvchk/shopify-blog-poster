name: Weekly Blog Post

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"  # Monday 07:00 Slovenia (UTC+2)

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Cache sentence-transformers model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-minilm-l6-v2-v1

      - name: Create temporary Shopify token
        env:
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          import requests

          shop = json.loads(Path("stores/my-store/store_config.json").read_text())["shopify_domain"]
          response = requests.post(
              f"https://{shop}/admin/oauth/access_token",
              data={
                  "client_id": os.environ["SHOPIFY_CLIENT_ID"],
                  "client_secret": os.environ["SHOPIFY_CLIENT_SECRET"],
                  "grant_type": "client_credentials",
              },
              timeout=30,
          )
          response.raise_for_status()
          token = response.json()["access_token"]
          print(f"::add-mask::{token}")
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"SHOPIFY_TOKEN={token}\n")
          PY

      - run: python poster.py --store my-store
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_KEY: ${{ secrets.PEXELS_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - run: |
          git config user.name "blog-bot"
          git config user.email "bot@agency.com"
          git add stores/
          git diff --cached --quiet || git commit -m "log: published blog post $(date +%Y-%m-%d)"
          git push
